services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: convoy-frontend
    ports:
      - '${FRONTEND_PORT:-8081}:80'
    environment:
      - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-https://convoy.vellur.in}
      - VITE_VAPID_PUBLIC_KEY=${VITE_VAPID_PUBLIC_KEY:-}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - convoy-network

  pocketbase:
    build:
      context: ./docker/pocketbase
      dockerfile: Dockerfile
    container_name: convoy-pocketbase
    ports:
      - '${POCKETBASE_PORT:-8090}:8090'
    volumes:
      - pocketbase_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    environment:
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@convoy.local}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-admin123456}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8090/_/']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - convoy-network

  osrm:
    image: osrm/osrm-backend:latest
    container_name: convoy-osrm
    ports:
      - '${OSRM_PORT:-5001}:5000'
    volumes:
      - osrm_data:/data
    command: osrm-routed --algorithm mld /data/monaco-latest.osrm
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - convoy-network

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: convoy-nominatim
    ports:
      - '${NOMINATIM_PORT:-8080}:8080'
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    environment:
      - POSTGRES_PASSWORD=${NOMINATIM_DB_PASSWORD:-nominatim}
      - POSTGRES_USER=${NOMINATIM_DB_USER:-nominatim}
      - POSTGRES_DB=${NOMINATIM_DB_NAME:-nominatim}
      - PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf
      - NOMINATIM_IMPORT_THREAD_COUNT=4
      - NOMINATIM_IMPORT_USE_TIGER_DATA=false
      - NOMINATIM_IMPORT_US_POSTCODES=false
      - NOMINATIM_IMPORT_GB_POSTCODES=false
      - NOMINATIM_IMPORT_WIKIPEDIA_DATA=false
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/status']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - convoy-network

  redis:
    image: redis:7-alpine
    container_name: convoy-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-convoyredis123}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-convoyredis123}', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - convoy-network

  simulation-service:
    build:
      context: ./apps/simulation-service
      dockerfile: Dockerfile
    container_name: convoy-simulation
    ports:
      - '${SIMULATION_PORT:-3002}:3002'
    environment:
      - SIMULATION_PORT=3002
      - POCKETBASE_URL=http://pocketbase:8090
      - OSRM_URL=http://osrm:5000
      - PB_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@convoy.local}
      - PB_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-admin123456}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:raga.vellur@gmail.com}
    volumes:
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - convoy-network

  voice-server:
    build:
      context: ./apps/voice-server
      dockerfile: Dockerfile
    container_name: convoy-voice
    ports:
      - '${VOICE_PORT:-3001}:3001'
      - '${MEDIASOUP_PORT_MIN:-20000}-${MEDIASOUP_PORT_MAX:-20100}:20000-20100/udp'
    environment:
      - VOICE_PORT=3001
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-}
      - MEDIASOUP_PORT_MIN=20000
      - MEDIASOUP_PORT_MAX=20100
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - convoy-network

volumes:
  pocketbase_data:
  osrm_data:
  nominatim_data:
  redis_data:

networks:
  convoy-network:
    driver: bridge
