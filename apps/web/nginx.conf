server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), autoplay=(self)" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets (JS/CSS) — immutable cache (Vite outputs content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker — no cache (always check for updates)
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Workbox runtime — short cache
    location /workbox- {
        expires 1h;
        add_header Cache-Control "public";
    }

    # PWA manifest
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Static assets (icons, robots.txt) — 1 week cache
    location /icons/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
