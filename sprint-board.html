<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convoy Platform - Sprint Board</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #bc8cff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .header-meta {
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            padding: 1rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .stat-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .stat-dot.backlog { background: var(--text-secondary); }
        .stat-dot.in-progress { background: var(--accent-blue); }
        .stat-dot.done { background: var(--accent-green); }

        .progress-bar-container {
            padding: 1rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .progress-bar {
            height: 8px;
            background: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .sprint-tabs {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .sprint-tab {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .sprint-tab:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .sprint-tab.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .sprint-tab .badge {
            background: rgba(255,255,255,0.2);
            padding: 0.125rem 0.375rem;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding: 1.5rem 2rem;
            min-height: calc(100vh - 250px);
        }

        .column {
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border);
            min-height: 400px;
        }

        .column-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .column-count {
            background: var(--bg-card);
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .column-body {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }

        .task-card.done {
            opacity: 0.6;
            border-color: var(--accent-green);
        }

        .task-card.in-progress {
            border-left: 3px solid var(--accent-blue);
        }

        .task-id {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-family: monospace;
            margin-bottom: 0.25rem;
        }

        .task-title {
            font-size: 0.875rem;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .priority-badge {
            font-size: 0.625rem;
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .priority-high { background: rgba(248, 81, 73, 0.2); color: var(--accent-red); }
        .priority-medium { background: rgba(210, 153, 34, 0.2); color: var(--accent-orange); }
        .priority-low { background: rgba(139, 148, 158, 0.2); color: var(--text-secondary); }

        .platform-badge {
            font-size: 0.625rem;
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            background: rgba(188, 140, 255, 0.2);
            color: var(--accent-purple);
        }

        .task-actions {
            display: flex;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }

        .task-btn {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-btn:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .task-btn.complete:hover {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .task-btn.start:hover {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        .sprint-info {
            padding: 1rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sprint-dates {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .platform-tag {
            background: rgba(188, 140, 255, 0.2);
            color: var(--accent-purple);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        @media (max-width: 1024px) {
            .board {
                grid-template-columns: 1fr;
            }
        }

        .legend {
            display: flex;
            gap: 1.5rem;
            padding: 0.75rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-line.in-progress { background: var(--accent-blue); }
        .legend-line.done { background: var(--accent-green); }
        .legend-line.backlog { background: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Convoy Platform - Sprint Board</h1>
        <div class="header-meta">
            <span>Mapping Stack: OpenStreetMap</span>
            <span>Backend: PocketBase</span>
            <span>Platform Order: Web → Android → iOS</span>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-dot backlog"></div>
            <span>Backlog: <strong id="backlog-count">0</strong></span>
        </div>
        <div class="stat-item">
            <div class="stat-dot in-progress"></div>
            <span>In Progress: <strong id="progress-count">0</strong></span>
        </div>
        <div class="stat-item">
            <div class="stat-dot done"></div>
            <span>Done: <strong id="done-count">0</strong></span>
        </div>
        <div class="stat-item">
            <span>Total: <strong id="total-count">0</strong></span>
        </div>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="progress-text">0% Complete</div>
    </div>

    <div class="sprint-tabs" id="sprint-tabs"></div>

    <div class="sprint-info" id="sprint-info">
        <div class="sprint-dates" id="sprint-dates"></div>
        <div class="platform-tag" id="platform-tag"></div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-line backlog"></div>
            <span>Backlog</span>
        </div>
        <div class="legend-item">
            <div class="legend-line in-progress"></div>
            <span>In Progress</span>
        </div>
        <div class="legend-item">
            <div class="legend-line done"></div>
            <span>Done</span>
        </div>
    </div>

    <div class="board" id="board">
        <div class="column" id="col-backlog">
            <div class="column-header">
                <div class="column-title">
                    📋 Backlog
                    <span class="column-count" id="backlog-col-count">0</span>
                </div>
            </div>
            <div class="column-body" id="backlog-tasks"></div>
        </div>
        <div class="column" id="col-progress">
            <div class="column-header">
                <div class="column-title">
                    🔄 In Progress
                    <span class="column-count" id="progress-col-count">0</span>
                </div>
            </div>
            <div class="column-body" id="progress-tasks"></div>
        </div>
        <div class="column" id="col-done">
            <div class="column-header">
                <div class="column-title">
                    ✅ Done
                    <span class="column-count" id="done-col-count">0</span>
                </div>
            </div>
            <div class="column-body" id="done-tasks"></div>
        </div>
    </div>

    <script>
        let sprintData = null;
        let currentSprint = 1;

        async function loadData() {
            try {
                const response = await fetch('sprint-data.json');
                sprintData = await response.json();
                renderTabs();
                renderSprint(currentSprint);
            } catch (error) {
                console.error('Error loading sprint data:', error);
                document.getElementById('board').innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <h3>Could not load sprint data</h3>
                        <p>Make sure sprint-data.json is in the same directory</p>
                    </div>
                `;
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('sprint-tabs');
            tabsContainer.innerHTML = sprintData.sprints.map(sprint => {
                const doneCount = sprint.tasks.filter(t => t.status === 'done').length;
                const totalCount = sprint.tasks.length;
                return `
                    <div class="sprint-tab ${sprint.id === currentSprint ? 'active' : ''}" 
                         onclick="selectSprint(${sprint.id})">
                        Sprint ${sprint.id}
                        <span class="badge">${doneCount}/${totalCount}</span>
                    </div>
                `;
            }).join('');
        }

        function selectSprint(id) {
            currentSprint = id;
            renderTabs();
            renderSprint(id);
        }

        function renderSprint(id) {
            const sprint = sprintData.sprints.find(s => s.id === id);
            if (!sprint) return;

            // Update sprint info
            document.getElementById('sprint-dates').textContent = 
                `${sprint.startDate} → ${sprint.endDate}`;
            document.getElementById('platform-tag').textContent = sprint.platform;

            // Categorize tasks
            const backlog = sprint.tasks.filter(t => t.status === 'backlog');
            const inProgress = sprint.tasks.filter(t => t.status === 'in-progress');
            const done = sprint.tasks.filter(t => t.status === 'done');

            // Update counts
            document.getElementById('backlog-col-count').textContent = backlog.length;
            document.getElementById('progress-col-count').textContent = inProgress.length;
            document.getElementById('done-col-count').textContent = done.length;

            // Render tasks
            document.getElementById('backlog-tasks').innerHTML = 
                backlog.map(t => renderTaskCard(t, 'backlog')).join('') || 
                '<div class="empty-state">No tasks in backlog</div>';
            
            document.getElementById('progress-tasks').innerHTML = 
                inProgress.map(t => renderTaskCard(t, 'in-progress')).join('') || 
                '<div class="empty-state">No tasks in progress</div>';
            
            document.getElementById('done-tasks').innerHTML = 
                done.map(t => renderTaskCard(t, 'done')).join('') || 
                '<div class="empty-state">No completed tasks</div>';

            // Update global stats
            updateGlobalStats();
        }

        function renderTaskCard(task, status) {
            const actions = status === 'backlog' ? `
                <div class="task-actions">
                    <button class="task-btn start" onclick="event.stopPropagation(); updateTask('${task.id}', 'in-progress')">▶ Start</button>
                </div>
            ` : status === 'in-progress' ? `
                <div class="task-actions">
                    <button class="task-btn" onclick="event.stopPropagation(); updateTask('${task.id}', 'backlog')">◀ Back</button>
                    <button class="task-btn complete" onclick="event.stopPropagation(); updateTask('${task.id}', 'done')">✓ Complete</button>
                </div>
            ` : `
                <div class="task-actions">
                    <button class="task-btn" onclick="event.stopPropagation(); updateTask('${task.id}', 'in-progress')">◀ Reopen</button>
                </div>
            `;

            return `
                <div class="task-card ${status}">
                    <div class="task-id">${task.id}</div>
                    <div class="task-title">${task.title}</div>
                    <div class="task-meta">
                        <span class="priority-badge priority-${task.priority}">${task.priority}</span>
                        ${task.fr ? `<span class="platform-badge">${task.fr}</span>` : ''}
                    </div>
                    ${actions}
                </div>
            `;
        }

        function updateTask(taskId, newStatus) {
            for (const sprint of sprintData.sprints) {
                const task = sprint.tasks.find(t => t.id === taskId);
                if (task) {
                    task.status = newStatus;
                    break;
                }
            }
            
            renderSprint(currentSprint);
            renderTabs();
            saveData();
        }

        function updateGlobalStats() {
            let backlog = 0, inProgress = 0, done = 0;
            
            for (const sprint of sprintData.sprints) {
                backlog += sprint.tasks.filter(t => t.status === 'backlog').length;
                inProgress += sprint.tasks.filter(t => t.status === 'in-progress').length;
                done += sprint.tasks.filter(t => t.status === 'done').length;
            }

            const total = backlog + inProgress + done;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('backlog-count').textContent = backlog;
            document.getElementById('progress-count').textContent = inProgress;
            document.getElementById('done-count').textContent = done;
            document.getElementById('total-count').textContent = total;
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('progress-text').textContent = `${percent}% Complete (${done}/${total} tasks)`;
        }

        function saveData() {
            // Save to localStorage as backup
            localStorage.setItem('sprintData', JSON.stringify(sprintData));
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
