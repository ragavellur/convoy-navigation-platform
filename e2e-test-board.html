<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convoy Platform - E2E Test Board</title>
    <style>
      :root {
        --bg-primary: #0d1117;
        --bg-secondary: #161b22;
        --bg-card: #21262d;
        --border: #30363d;
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --accent-blue: #58a6ff;
        --accent-green: #3fb950;
        --accent-orange: #d29922;
        --accent-red: #f85149;
        --accent-purple: #bc8cff;
        --accent-cyan: #39d2c0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
      }

      .header {
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .header-meta {
        display: flex;
        gap: 2rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
        flex-wrap: wrap;
      }

      .stats-bar {
        display: flex;
        gap: 1.5rem;
        padding: 1rem 2rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .stat-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
      }

      .stat-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .stat-dot.pending {
        background: var(--text-secondary);
      }
      .stat-dot.running {
        background: var(--accent-blue);
      }
      .stat-dot.passed {
        background: var(--accent-green);
      }
      .stat-dot.failed {
        background: var(--accent-red);
      }
      .stat-dot.skipped {
        background: var(--accent-orange);
      }

      .progress-bar-container {
        padding: 1rem 2rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
      }

      .progress-bar {
        height: 8px;
        background: var(--bg-card);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
      }

      .progress-segment {
        height: 100%;
        transition: width 0.3s ease;
      }
      .progress-segment.passed {
        background: var(--accent-green);
      }
      .progress-segment.failed {
        background: var(--accent-red);
      }
      .progress-segment.running {
        background: var(--accent-blue);
      }

      .progress-text {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 0.25rem;
      }

      .sprint-tabs {
        display: flex;
        gap: 0.5rem;
        padding: 1rem 2rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }

      .sprint-tab {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        font-size: 0.875rem;
        transition: all 0.2s;
      }

      .sprint-tab:hover {
        border-color: var(--accent-blue);
        color: var(--text-primary);
      }
      .sprint-tab.active {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
        color: white;
      }

      .sprint-tab .badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 0.125rem 0.375rem;
        border-radius: 10px;
        font-size: 0.75rem;
        margin-left: 0.5rem;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        padding: 1.5rem 2rem;
        min-height: calc(100vh - 280px);
      }

      .column {
        background: var(--bg-secondary);
        border-radius: 8px;
        border: 1px solid var(--border);
        min-height: 400px;
      }

      .column-header {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .column-title {
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .column-count {
        background: var(--bg-card);
        padding: 0.125rem 0.5rem;
        border-radius: 10px;
        font-size: 0.75rem;
        color: var(--text-secondary);
      }

      .column-body {
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .test-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.75rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .test-card:hover {
        border-color: var(--accent-blue);
        transform: translateY(-1px);
      }
      .test-card.passed {
        border-left: 3px solid var(--accent-green);
        opacity: 0.85;
      }
      .test-card.failed {
        border-left: 3px solid var(--accent-red);
      }
      .test-card.running {
        border-left: 3px solid var(--accent-blue);
      }
      .test-card.skipped {
        border-left: 3px solid var(--accent-orange);
        opacity: 0.6;
      }

      .test-id {
        font-size: 0.75rem;
        color: var(--accent-cyan);
        font-family: monospace;
        margin-bottom: 0.25rem;
      }

      .test-title {
        font-size: 0.875rem;
        line-height: 1.4;
        margin-bottom: 0.5rem;
      }

      .test-steps {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
        font-style: italic;
      }

      .test-expected {
        font-size: 0.75rem;
        color: var(--accent-green);
        margin-bottom: 0.5rem;
      }

      .test-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.25rem;
      }

      .priority-badge {
        font-size: 0.625rem;
        padding: 0.125rem 0.375rem;
        border-radius: 3px;
        text-transform: uppercase;
        font-weight: 600;
      }

      .priority-high {
        background: rgba(248, 81, 73, 0.2);
        color: var(--accent-red);
      }
      .priority-medium {
        background: rgba(210, 153, 34, 0.2);
        color: var(--accent-orange);
      }
      .priority-low {
        background: rgba(139, 148, 158, 0.2);
        color: var(--text-secondary);
      }

      .sprint-badge {
        font-size: 0.625rem;
        padding: 0.125rem 0.375rem;
        border-radius: 3px;
        background: rgba(188, 140, 255, 0.2);
        color: var(--accent-purple);
      }

      .task-badge {
        font-size: 0.625rem;
        padding: 0.125rem 0.375rem;
        border-radius: 3px;
        background: rgba(88, 166, 255, 0.2);
        color: var(--accent-blue);
        font-family: monospace;
      }

      .test-actions {
        display: flex;
        gap: 0.25rem;
        margin-top: 0.5rem;
      }

      .test-btn {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg-secondary);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.2s;
      }

      .test-btn:hover {
        background: var(--accent-blue);
        color: white;
        border-color: var(--accent-blue);
      }
      .test-btn.pass:hover {
        background: var(--accent-green);
        border-color: var(--accent-green);
      }
      .test-btn.fail:hover {
        background: var(--accent-red);
        border-color: var(--accent-red);
      }
      .test-btn.reset:hover {
        background: var(--accent-orange);
        border-color: var(--accent-orange);
      }

      .legend {
        display: flex;
        gap: 1.5rem;
        padding: 0.75rem 2rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        font-size: 0.75rem;
        color: var(--text-secondary);
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }
      .legend-line {
        width: 20px;
        height: 3px;
        border-radius: 2px;
      }
      .legend-line.pending {
        background: var(--text-secondary);
      }
      .legend-line.running {
        background: var(--accent-blue);
      }
      .legend-line.passed {
        background: var(--accent-green);
      }
      .legend-line.failed {
        background: var(--accent-red);
      }
      .legend-line.skipped {
        background: var(--accent-orange);
      }

      .category-header {
        grid-column: 1 / -1;
        padding: 0.75rem 1rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--accent-purple);
      }

      .category-header .cat-stats {
        margin-left: auto;
        display: flex;
        gap: 1rem;
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-weight: 400;
      }

      .empty-state {
        text-align: center;
        padding: 2rem;
        color: var(--text-secondary);
      }

      @media (max-width: 1024px) {
        .board {
          grid-template-columns: 1fr;
        }
      }

      .sprint-info {
        padding: 1rem 2rem;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .sprint-dates {
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      .platform-tag {
        background: rgba(57, 210, 192, 0.2);
        color: var(--accent-cyan);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Convoy Platform — E2E Test Board</h1>
      <div class="header-meta">
        <span>Mapping Stack: OpenStreetMap</span>
        <span>Backend: PocketBase</span>
        <span>Scope: Post-Sprint 4 Full Verification</span>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-dot pending"></div>
        <span>Pending: <strong id="pending-count">0</strong></span>
      </div>
      <div class="stat-item">
        <div class="stat-dot running"></div>
        <span>Running: <strong id="running-count">0</strong></span>
      </div>
      <div class="stat-item">
        <div class="stat-dot passed"></div>
        <span>Passed: <strong id="passed-count">0</strong></span>
      </div>
      <div class="stat-item">
        <div class="stat-dot failed"></div>
        <span>Failed: <strong id="failed-count">0</strong></span>
      </div>
      <div class="stat-item">
        <div class="stat-dot skipped"></div>
        <span>Skipped: <strong id="skipped-count">0</strong></span>
      </div>
      <div class="stat-item">
        <span>Total: <strong id="total-count">0</strong></span>
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
      <div class="progress-text" id="progress-text">0% Complete</div>
    </div>

    <div class="sprint-tabs" id="sprint-tabs"></div>

    <div class="sprint-info">
      <div class="sprint-dates" id="sprint-dates">Post-Sprint 4 — Full E2E Verification</div>
      <div class="platform-tag" id="platform-tag">Web PWA</div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-line pending"></div>
        <span>Pending</span>
      </div>
      <div class="legend-item">
        <div class="legend-line running"></div>
        <span>Running</span>
      </div>
      <div class="legend-item">
        <div class="legend-line passed"></div>
        <span>Passed</span>
      </div>
      <div class="legend-item">
        <div class="legend-line failed"></div>
        <span>Failed</span>
      </div>
      <div class="legend-item">
        <div class="legend-line skipped"></div>
        <span>Skipped</span>
      </div>
    </div>

    <div class="board" id="board"></div>

    <script>
      let testData = null
      let currentCategory = 'all'

      async function loadData() {
        try {
          const response = await fetch('e2e-test-data.json?v=' + Date.now(), { cache: 'no-store' })
          testData = await response.json()
          renderTabs()
          renderBoard()
        } catch (error) {
          console.error('Error loading test data:', error)
          document.getElementById('board').innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <h3>Could not load test data</h3>
              <p>Make sure e2e-test-data.json is in the same directory</p>
            </div>
          `
        }
      }

      function getAllTests() {
        if (!testData) return []
        return testData.categories.flatMap((cat) => cat.tests)
      }

      function updateStats() {
        const all = getAllTests()
        const counts = { pending: 0, running: 0, passed: 0, failed: 0, skipped: 0 }
        all.forEach((t) => {
          if (counts[t.status] !== undefined) counts[t.status]++
        })

        document.getElementById('pending-count').textContent = counts.pending
        document.getElementById('running-count').textContent = counts.running
        document.getElementById('passed-count').textContent = counts.passed
        document.getElementById('failed-count').textContent = counts.failed
        document.getElementById('skipped-count').textContent = counts.skipped
        document.getElementById('total-count').textContent = all.length

        const total = all.length
        const done = counts.passed + counts.failed + counts.skipped
        const pct = total > 0 ? Math.round((done / total) * 100) : 0

        const bar = document.getElementById('progress-bar')
        bar.innerHTML = ''
        if (counts.passed > 0) {
          const seg = document.createElement('div')
          seg.className = 'progress-segment passed'
          seg.style.width = (counts.passed / total) * 100 + '%'
          bar.appendChild(seg)
        }
        if (counts.failed > 0) {
          const seg = document.createElement('div')
          seg.className = 'progress-segment failed'
          seg.style.width = (counts.failed / total) * 100 + '%'
          bar.appendChild(seg)
        }
        if (counts.running > 0) {
          const seg = document.createElement('div')
          seg.className = 'progress-segment running'
          seg.style.width = (counts.running / total) * 100 + '%'
          bar.appendChild(seg)
        }

        document.getElementById('progress-text').textContent =
          `${pct}% Complete — ${counts.passed}/${total} passed`
      }

      function renderTabs() {
        const container = document.getElementById('sprint-tabs')
        container.innerHTML = ''

        const allTab = document.createElement('div')
        allTab.className = 'sprint-tab' + (currentCategory === 'all' ? ' active' : '')
        const allTests = getAllTests()
        allTab.innerHTML = `All <span class="badge">${allTests.length}</span>`
        allTab.onclick = () => {
          currentCategory = 'all'
          renderTabs()
          renderBoard()
        }
        container.appendChild(allTab)

        testData.categories.forEach((cat) => {
          const tab = document.createElement('div')
          tab.className = 'sprint-tab' + (currentCategory === cat.id ? ' active' : '')
          tab.innerHTML = `${cat.name} <span class="badge">${cat.tests.length}</span>`
          tab.onclick = () => {
            currentCategory = cat.id
            renderTabs()
            renderBoard()
          }
          container.appendChild(tab)
        })
      }

      function renderBoard() {
        const board = document.getElementById('board')
        board.innerHTML = ''
        updateStats()

        const categories =
          currentCategory === 'all'
            ? testData.categories
            : testData.categories.filter((c) => c.id === currentCategory)

        const statusGroups = { pending: [], running: [], passed: [], failed: [], skipped: [] }

        categories.forEach((cat) => {
          cat.tests.forEach((test) => {
            if (statusGroups[test.status]) {
              statusGroups[test.status].push({ ...test, categoryName: cat.name })
            }
          })
        })

        const columns = [
          { key: 'pending', title: '⏳ Pending', icon: '⏳' },
          { key: 'running', title: '🔄 Running', icon: '🔄' },
          { key: 'passed', title: '✅ Passed', icon: '✅' },
          { key: 'failed', title: '❌ Failed', icon: '❌' },
          { key: 'skipped', title: '⏭️ Skipped', icon: '⏭️' },
        ]

        columns.forEach((col) => {
          const colDiv = document.createElement('div')
          colDiv.className = 'column'

          const tests = statusGroups[col.key]

          colDiv.innerHTML = `
            <div class="column-header">
              <div class="column-title">
                ${col.title}
                <span class="column-count">${tests.length}</span>
              </div>
            </div>
            <div class="column-body" id="tests-${col.key}"></div>
          `
          board.appendChild(colDiv)

          const body = colDiv.querySelector('.column-body')
          tests.forEach((test) => {
            const card = document.createElement('div')
            card.className = `test-card ${test.status}`
            card.innerHTML = `
              <div class="test-id">${test.id}</div>
              <div class="test-title">${test.title}</div>
              <div class="test-steps">${test.steps}</div>
              <div class="test-expected">Expected: ${test.expected}</div>
              <div class="test-meta">
                <span class="priority-badge priority-${test.priority}">${test.priority}</span>
                <span class="sprint-badge">${test.sprint}</span>
                ${test.taskId !== '—' ? `<span class="task-badge">${test.taskId}</span>` : ''}
              </div>
              <div class="test-actions">
                ${test.status !== 'passed' ? `<button class="test-btn pass" onclick="updateTest('${test.id}','passed')">Pass</button>` : ''}
                ${test.status !== 'failed' ? `<button class="test-btn fail" onclick="updateTest('${test.id}','failed')">Fail</button>` : ''}
                ${test.status !== 'pending' ? `<button class="test-btn reset" onclick="updateTest('${test.id}','pending')">Reset</button>` : ''}
                ${test.status !== 'skipped' ? `<button class="test-btn" onclick="updateTest('${test.id}','skipped')">Skip</button>` : ''}
              </div>
            `
            body.appendChild(card)
          })
        })
      }

      function updateTest(testId, newStatus) {
        for (const cat of testData.categories) {
          for (const test of cat.tests) {
            if (test.id === testId) {
              test.status = newStatus
              break
            }
          }
        }
        renderTabs()
        renderBoard()
        saveData()
      }

      async function saveData() {
        try {
          const blob = new Blob([JSON.stringify(testData, null, 2)], { type: 'application/json' })
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = 'e2e-test-data.json'
          a.click()
          URL.revokeObjectURL(url)
        } catch (e) {
          console.error('Could not auto-save:', e)
        }
      }

      loadData()
    </script>
  </body>
</html>
